name: Hono ERP parity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Vue, Hono, and D1 parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile Vue frontend
        run: npm run build
      - name: Type-check Hono backend
        run: npx tsc -p tsconfig.server.json --noEmit
      - name: Run Mohim parity integration tests
        run: npm run test:parity
      - name: Apply SQL migrations to temporary local D1 only
        run: npx wrangler d1 migrations apply DB --local
