name: ERP UI Build
on:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-build.yml'
  workflow_dispatch:
jobs:
  ui-build:
    name: Vue TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/pos-hisabiq-ui.test.mjs
