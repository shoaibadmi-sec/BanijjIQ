# Explicitly authorized, preview-only fixture import. NEVER runs automatically.
name: Seed isolated HisabIQ demo data into live preview D1
on:
  workflow_dispatch:
    inputs:
      reviewed_commit_sha:
        description: 'Exact current main SHA reviewed for demo seeding'
        required: true
        type: string
      confirm_demo_seeding:
        description: 'Type SEED-ISOLATED-DEMO-ONLY (one-shot preview write)'
        required: true
        type: string
permissions:
  contents: read

jobs:
  validate-demo-fixture:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_demo_seeding == 'SEED-ISOLATED-DEMO-ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm exact current main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$REVIEWED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact checkout and fully migrated real accounting test
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          npm ci
          npm run backend:build
          node --import tsx --test tests/preview-demo-seed.integration.test.ts
          node --import tsx scripts/preview/demo-seed-remote.mjs --dry-run

  seed-isolated-preview:
    needs: validate-demo-fixture
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_demo_seeding == 'SEED-ISOLATED-DEMO-ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: hisabiq-react-preview
    concurrency:
      group: hisabiq-react-preview-demo-seed
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HISABIQ_PREVIEW_D1_ID: ${{ secrets.HISABIQ_PREVIEW_D1_ID }}
      HISABIQ_PREVIEW_ADMIN_PHONE: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PHONE }}
      HISABIQ_PREVIEW_ADMIN_PASSWORD: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PASSWORD }}
      HISABIQ_DEMO_SEED_CONFIRM: ${{ inputs.confirm_demo_seeding }}
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify current main unchanged before preview writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$REVIEWED_SHA"
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HISABIQ_PREVIEW_D1_ID HISABIQ_PREVIEW_ADMIN_PHONE HISABIQ_PREVIEW_ADMIN_PASSWORD; do
            test -n "${!key:-}" || { echo "::error::Missing preview-only environment credential: $key"; exit 1; }
          done
      - name: Install pinned backend & build React for preview isolation config
        run: |
          npm ci
          npm run react:build
      - name: Prove isolated preview D1 UUID/name, no production binding
        run: |
          node scripts/preview/build-config.mjs
          node scripts/preview/preflight-remote-db.mjs
      - name: Recheck exact current main immediately before preview writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$REVIEWED_SHA"
      - name: Seed existing HisabIQ fixture via authenticated PREVIEW APIs ONLY
        run: node --import tsx scripts/preview/demo-seed-remote.mjs --apply