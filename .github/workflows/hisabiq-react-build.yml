name: HisabIQ React / BanijjIQ API integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'apps/hisabiq-web'
      - 'react-integration/**'
      - 'ui-checks/**'
      - 'scripts/preview/**'
      - 'docs/hisabiq-react-phase14.md'
      - 'docs/hosted-react-preview.md'
      - 'wrangler.hisabiq-preview.generated.jsonc'
      - 'd1-checks/**'
      - 'wrangler.d1-ci.jsonc'
      - 'server/modules/reporting/**'
      - 'server/modules/products/**'
      - 'server/modules/sales/**'
      - 'server/modules/purchases/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/prepare-hisabiq-react.mjs'
      - '.github/workflows/hisabiq-react-build.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      deploy_hosted_preview:
        description: 'Deploy a distinct Cloudflare-hosted preview (never production)'
        required: true
        default: false
        type: boolean
      confirm_isolated_preview:
        description: 'Type ISOLATED-PREVIEW-ONLY to authorize a remote preview deployment'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/hisabiq-web/package-lock.json
      - name: Verify pinned React submodule and integration adapter
        run: |
          git submodule status
          node --test react-integration/tests/contract.test.mjs
          node --test react-integration/tests/reports-two-tabs.contract.test.mjs
          node --test react-integration/tests/reports-live-route.test.mjs
          node --test react-integration/tests/reports-source-parity.test.mjs
          node --test react-integration/tests/products-source-parity.test.mjs
          node --test react-integration/tests/pos-source-parity.test.mjs
          node --test react-integration/tests/pos-checkout-source-parity.test.mjs
          node --test react-integration/tests/products-live-route.test.mjs
          node --test react-integration/tests/phase4-purchase-route.test.mjs
      - name: Check hosted-preview isolation (dry run, no Cloudflare credentials)
        run: |
          node scripts/preview/build-config.mjs --self-test
          node --test tests/preview-deploy.contract.test.mjs
          node --test tests/pr-preview.contract.test.mjs
      - name: Typecheck BanijjIQ backend
        run: |
          npm ci
          npm run backend:build
          node --import tsx --test tests/reports-v2-query.integration.test.ts tests/reports-v2-route.integration.test.ts
          node --import tsx --test tests/reports-phase5-acceptance.integration.test.ts
          node --import tsx --test tests/reports-sales-profit.integration.test.ts
          node --import tsx --test tests/reports-stock-dues.integration.test.ts
          node --import tsx --test tests/reports-stock-dues-route.integration.test.ts
          node --import tsx --test tests/reports-cash-expenses.integration.test.ts
          node --import tsx --test tests/reports-cash-expenses-route.integration.test.ts
          node --import tsx --test tests/product-catalog.integration.test.ts tests/pos-accounting.integration.test.ts tests/products-hybrid.integration.test.ts tests/pos-unit-profile.integration.test.ts tests/pos-mixed-sale.integration.test.ts tests/pos-mixed-return.integration.test.ts tests/pos-mixed-reversal.integration.test.ts tests/pos-bank-reversal.integration.test.ts tests/pos-due-reversal.integration.test.ts
          npm run test:phase4
          node --import tsx --test react-integration/tests/products-contract.test.ts react-integration/tests/products-ui-contract.test.ts
      - name: Measure Phase 4F purchase/supplier function coverage with real isolated DB
        run: |
          set -o pipefail
          mkdir -p d1-checks/output
          node --import tsx --experimental-test-coverage --test-coverage-include='server/modules/purchases/**' --test tests/phase4-*.integration.test.ts | tee d1-checks/output/phase4-function-coverage.txt
      - name: Compile original HisabIQ React app with API integration overlays
        run: npm run react:build
      - name: Verify source submodule stays clean
        run: test -z "$(git -C apps/hisabiq-web status --porcelain)"
      - name: Ensure React production assets exist
        run: test -f .generated/hisabiq-web/dist/index.html
      - name: Install Chromium for UI visual and accessibility checks
        run: |
          cd .generated/hisabiq-web
          npx playwright install --with-deps chromium
      - name: Run mocked-API Playwright UI checks
        run: node ui-checks/run.mjs
      - name: Test real Cloudflare Worker with isolated local D1
        run: |
          node d1-checks/run.mjs
          node d1-checks/phase12.mjs
          node d1-checks/phase13-browser.mjs
      - name: Upload local Worker/D1 SQL reconciliation and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-worker-d1-local-checks
          path: d1-checks/output
          retention-days: 14
          if-no-files-found: warn
      - name: Upload responsive screenshots, axe reports and browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-react-ui-checks
          path: ui-checks/output
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hisabiq-react-preview-dist
          path: .generated/hisabiq-web/dist
          retention-days: 7

  deploy-hosted-preview:
    # Neither pull requests nor routine CI can deploy a Worker.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_hosted_preview == true && inputs.confirm_isolated_preview == 'ISOLATED-PREVIEW-ONLY' && github.ref == 'refs/heads/feat/hisabiq-react-api' }}
    needs: react-build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: hisabiq-react-preview
    concurrency:
      group: hisabiq-react-preview-hosted-deploy
      cancel-in-progress: false
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HISABIQ_PREVIEW_D1_ID: ${{ secrets.HISABIQ_PREVIEW_D1_ID }}
      HISABIQ_PREVIEW_SETUP_SECRET: ${{ secrets.HISABIQ_PREVIEW_SETUP_SECRET }}
      HISABIQ_PREVIEW_ADMIN_PHONE: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PHONE }}
      HISABIQ_PREVIEW_ADMIN_PASSWORD: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Require distinct preview credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HISABIQ_PREVIEW_D1_ID HISABIQ_PREVIEW_SETUP_SECRET HISABIQ_PREVIEW_ADMIN_PHONE HISABIQ_PREVIEW_ADMIN_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Missing preview credential::Set $key in GitHub environment hisabiq-react-preview."
              exit 1
            fi
          done
          test "${#HISABIQ_PREVIEW_ADMIN_PASSWORD}" -ge 12
          test "${#HISABIQ_PREVIEW_SETUP_SECRET}" -ge 24
      - name: Install pinned backend and Wrangler dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: hisabiq-react-preview-dist
          path: .generated/hisabiq-web/dist
      - name: Generate preview-only Wrangler config, refusing production UUID
        run: |
          test -f .generated/hisabiq-web/dist/index.html
          node scripts/preview/build-config.mjs
      - name: Verify remote D1 UUID AND name before applying any migrations
        run: node scripts/preview/preflight-remote-db.mjs
      - name: Apply migrations ONLY to isolated remote D1
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.hisabiq-preview.generated.jsonc
      - name: Deploy separate React preview Worker
        run: npx --no-install wrangler deploy --config wrangler.hisabiq-preview.generated.jsonc
      - name: Set the preview-only administrator setup secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HISABIQ_PREVIEW_SETUP_SECRET" | npx --no-install wrangler secret put SETUP_SECRET --config wrangler.hisabiq-preview.generated.jsonc
      - name: Verify hosted preview health, login, Products and POS reads
        run: node scripts/preview/remote-smoke.mjs
      - name: Upload sanitized preview check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-hosted-preview-smoke
          path: preview-checks/output
          retention-days: 14
          if-no-files-found: warn

  accept-hosted-preview:
    # Read-only acceptance is allowed ONLY after an explicitly authorized and
    # successful isolated hosted deployment. Never runs from pull_request.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_isolated_preview == 'ISOLATED-PREVIEW-ONLY' && inputs.deploy_hosted_preview == true && github.ref == 'refs/heads/feat/hisabiq-react-api' }}
    needs: deploy-hosted-preview
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: hisabiq-react-preview
    concurrency:
      group: hisabiq-react-preview-read-only-acceptance
      cancel-in-progress: false
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HISABIQ_PREVIEW_ADMIN_PHONE: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PHONE }}
      HISABIQ_PREVIEW_ADMIN_PASSWORD: ${{ secrets.HISABIQ_PREVIEW_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned React build and Playwright dependencies
        run: |
          npm ci
          npm run react:build
          cd .generated/hisabiq-web
          npx playwright install --with-deps chromium
      - name: Test real isolated preview in read-only Chromium
        run: node scripts/preview/browser-acceptance.mjs --remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hisabiq-hosted-read-only-acceptance
          path: preview-checks/output
          retention-days: 14
          if-no-files-found: warn
