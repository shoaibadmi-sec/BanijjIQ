name: HisabIQ React / BanijjIQ API integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'apps/hisabiq-web'
      - 'react-integration/**'
      - 'ui-checks/**'
      - 'd1-checks/**'
      - 'wrangler.d1-ci.jsonc'
      - 'server/modules/products/**'
      - 'server/modules/sales/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/prepare-hisabiq-react.mjs'
      - '.github/workflows/hisabiq-react-build.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/hisabiq-web/package-lock.json
      - name: Verify pinned React submodule and integration adapter
        run: |
          git submodule status
          node --test react-integration/tests/contract.test.mjs
      - name: Typecheck BanijjIQ backend
        run: |
          npm ci
          npm run backend:build
          node --import tsx --test tests/product-catalog.integration.test.ts tests/pos-accounting.integration.test.ts
      - name: Compile original HisabIQ React app with API integration overlays
        run: npm run react:build
      - name: Verify source submodule stays clean
        run: test -z "$(git -C apps/hisabiq-web status --porcelain)"
      - name: Ensure React production assets exist
        run: test -f .generated/hisabiq-web/dist/index.html
      - name: Install Chromium for UI visual and accessibility checks
        run: |
          cd .generated/hisabiq-web
          npx playwright install --with-deps chromium
      - name: Run mocked-API Playwright UI checks
        run: node ui-checks/run.mjs
      - name: Test real Cloudflare Worker with isolated local D1
        run: node d1-checks/run.mjs
      - name: Upload local Worker/D1 SQL reconciliation and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-worker-d1-local-checks
          path: d1-checks/output
          retention-days: 14
          if-no-files-found: warn
      - name: Upload responsive screenshots, axe reports and browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-react-ui-checks
          path: ui-checks/output
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hisabiq-react-preview-dist
          path: .generated/hisabiq-web/dist
          retention-days: 7
